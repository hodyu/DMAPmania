<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DMAPmania</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="video" playsinline></video>
  <div id="toast"></div>

  <section id="menu" class="screen center">
    <h1 class="logo">DMAPmania</h1>
    <nav class="menu-nav">
      <button data-go="play" data-key="KeyP">플레이 <kbd>P</kbd></button>
      <button data-go="edit" data-key="KeyE">에디터 <kbd>E</kbd></button>
      <button data-go="settings" data-key="KeyS">설정 <kbd>S</kbd></button>
    </nav>
  </section>

  <section id="select" class="screen">
    <div class="sel-info">
      <h2 id="selTitle">곡을 선택하세요</h2>
      <p id="selArtist"></p>
      <div id="selStats" class="stats"></div>
      <div id="diffList" class="diff-list"></div>
    </div>
    <div class="sel-list">
      <input id="search" placeholder="검색 (제목, 아티스트, 초성)">
      <ul id="songList"></ul>
    </div>
    <footer class="sel-foot">
      <button data-back>뒤로</button>
      <label>db.js 불러오기 <input id="dbFiles" type="file" accept=".js" multiple></label>
      <label>로컬 .mp4 <input id="localFile" type="file" accept="video/mp4"></label>
      <span id="songCount" class="grow"></span>
      <button id="startBtn">시작</button>
    </footer>
  </section>

  <section id="play" class="screen">
    <canvas id="playCanvas" width="1280" height="720"></canvas>
    <button id="pauseBtn">❚❚</button>
    <div id="result" class="overlay hidden"></div>
    <div id="pause" class="overlay hidden">
      <h2>일시정지</h2>
      <button id="pResume" class="big accent">계속하기</button>
      <button id="pRetry" class="big">다시 시작</button>
      <button id="pQuit" class="big">나가기</button>
    </div>
  </section>

  <section id="editor" class="screen">
    <div class="bar">
      <button class="link" data-back>← 뒤로</button>
      <b id="edTitle" class="grow"></b>
      <button id="edSave">저장</button>
      <button id="edTest" class="accent">테스트 플레이</button>
    </div>
    <div class="edBody">
      <canvas id="edCanvas" width="420" height="560"></canvas>
      <div class="panel">
        <div class="diffs">
          <select id="edDiff"></select>
          <button id="edDiffAdd">추가</button>
          <button id="edDiffDel">삭제</button>
        </div>
        <div class="pair">
          <label>난이도 이름 <input id="edDiffName" maxlength="20"></label>
          <label>레벨 <span class="diffs"><input id="edLevel" type="number" min="1"><button id="edAutoLevel" title="별점으로 레벨 정하기">★</button></span></label>
        </div>
        <div class="tools">
          <button data-tool="note" class="on">노트</button>
          <button data-tool="long">롱노트</button>
          <button data-tool="erase">지우기</button>
        </div>
        <div class="pair">
          <label>키 수 <select id="edKeys"><option>4</option><option>5</option><option>6</option><option>7</option></select></label>
          <label>비트 스냅 <select id="edSnap"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option></select></label>
          <label>BPM <input id="edBpm" type="number" step="0.01"></label>
          <label>오프셋 (ms) <input id="edOffset" type="number"></label>
        </div>
        <p class="dim">클릭: 노트 · 드래그(롱노트 도구): 롱노트<br>우클릭: 삭제 · 휠: 이동 · Space: 재생/정지</p>
        <p id="edCount" class="dim"></p>
      </div>
    </div>
    <div class="bar">
      <button id="edPlay" class="accent">▶</button>
      <span id="edTime">0:00 / 0:00</span>
      <div id="edBar" class="tbar grow"><canvas id="edBarCv"></canvas><span id="edHover"></span></div>
    </div>
  </section>

  <section id="settings" class="screen center">
    <h2>설정</h2>
    <div class="row"><span>키 모드</span><div id="keyModes" class="seg"></div></div>
    <div class="row col">
      <span>키 배치</span>
      <div id="keySlots" class="slots"></div>
      <button id="resetKeys" class="link">기본값으로</button>
    </div>
    <label class="row">스크롤 속도 <span><input id="setSpeed" type="range" min="0.3" max="3" step="0.1"> <b id="speedVal"></b></span></label>
    <label class="row">오디오 오프셋 (ms) <input id="setOffset" type="number"></label>
    <label class="row">배경 영상 표시 <input id="setBg" type="checkbox"></label>
    <label class="row">볼륨 <input id="setVolume" type="range" min="0" max="1" step="0.05"></label>
    <button class="big" data-back>저장하고 돌아가기</button>
  </section>

  <script src="js/songs.js"></script>
  <script src="js/common.js"></script>
  <script src="js/select.js"></script>
  <script src="js/game.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
